<meta charset="utf-8">
<title>Otis Camp Claim</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">

<style>
:root{
  --pine-0:#1a2f21; --pine-1:#254028; --pine-2:#315434; --pine-3:#3f6b40;
  --field:#a9b06f; --field-2:#bcc084; --dirt:#c9a06d; --dirt-edge:#a8804f;
  --trail:#6ba3c4;
  --paper:#e9dfc7; --paper-2:#f2ead8;
  --ink:#1b2018; --ink-2:#4a5343; --ink-3:#7c8472;
  --dusk:#6b5a90; --dusk-soft:#8f7bb8;
  --ember:#c9502a; --sun:#e0a138;
  --rule:rgba(27,32,24,.16);
  --panel:rgba(242,234,216,.93); --panel-solid:#f2ead8;
  --shadow:0 12px 34px rgba(23,34,22,.22);
  --good:#4e8b4a; --warn:#c98a2b; --full:#b04a30;
  --tree-a:#26472e; --tree-b:#33603a; --tree-c:#1d3a25;
  --map-ink:#f3ecd9; --map-ink-2:rgba(255,255,255,.76);
  --timber:#6b4b32; --timber-2:#8a6644; --glow:#f0b850;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pine-0:#0d1811; --pine-1:#132218; --pine-2:#1a2f20; --pine-3:#24422a;
    --field:#5a6440; --field-2:#6b7549; --dirt:#8a6c48; --dirt-edge:#5f4a31;
    --trail:#4b7d9c;
    --paper:#1a201b; --paper-2:#212a22;
    --ink:#ece4d0; --ink-2:#bdc3b1; --ink-3:#8b9384;
    --dusk:#a992d6; --dusk-soft:#8b74bd;
    --ember:#e9683d; --sun:#f0b850;
    --rule:rgba(236,228,208,.16);
    --panel:rgba(33,42,34,.93); --panel-solid:#212a22;
    --shadow:0 12px 34px rgba(0,0,0,.5);
    --tree-a:#183120; --tree-b:#204028; --tree-c:#12271a;
    --timber:#4e3724; --timber-2:#6b4d33;
  }
}
:root[data-theme="dark"]{
  --pine-0:#0d1811; --pine-1:#132218; --pine-2:#1a2f20; --pine-3:#24422a;
  --field:#5a6440; --field-2:#6b7549; --dirt:#8a6c48; --dirt-edge:#5f4a31;
  --trail:#4b7d9c;
  --paper:#1a201b; --paper-2:#212a22;
  --ink:#ece4d0; --ink-2:#bdc3b1; --ink-3:#8b9384;
  --rule:rgba(236,228,208,.16);
  --panel:rgba(33,42,34,.93); --panel-solid:#212a22;
  --shadow:0 12px 34px rgba(0,0,0,.5);
  --tree-a:#183120; --tree-b:#204028; --tree-c:#12271a;
  --timber:#4e3724; --timber-2:#6b4d33;
}

*{box-sizing:border-box}
html{height:100%;overscroll-behavior:none}
body{margin:0;height:100dvh;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--dusk);outline-offset:2px;border-radius:4px}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.eyebrow{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

#app{position:fixed;inset:0;height:100dvh;width:100vw;display:grid;grid-template-columns:360px 1fr}
#stage{position:relative;overflow:hidden;background:var(--pine-0);cursor:grab;touch-action:none}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#canopy,#terrain,#overlay{position:absolute;left:0;top:0;display:block}
#canopy{filter:blur(2px);opacity:.95}
#overlay{pointer-events:none}
.anchor{position:absolute;width:0;height:0}
.counter{position:absolute;left:0;top:0;transform-origin:0 0;transform:var(--cr)}

#rail{position:relative;z-index:5;background:var(--panel-solid);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.plate{padding:16px 18px 14px;border-bottom:1px solid var(--rule);
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(127,127,127,.06) 46px 47px),linear-gradient(180deg,var(--paper-2),var(--paper))}
.wordmark{font-family:"Alfa Slab One",Georgia,serif;font-size:30px;line-height:.94;letter-spacing:-.015em;margin:2px 0 6px;text-wrap:balance}
.wordmark span{color:var(--ember)}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;padding:8px 11px 9px;border-bottom:2px solid transparent;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ember)}
.panes{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pane{display:none;padding:14px 16px 28px}
.pane.on{display:block}

.you{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.you .meta{min-width:0;flex:1}
.you .nm{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkish{background:none;border:0;padding:0;color:var(--dusk);text-decoration:underline;text-underline-offset:2px;font-size:13px}

.zlist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.zrow{width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:11px 12px 10px;display:grid;gap:7px;transition:border-color .15s}
.zrow:hover{border-color:var(--dusk-soft)}
.zrow.mine{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 7%,var(--paper))}
.rowacts{display:flex;align-items:center;gap:8px;margin-top:1px}
.mini{border:1px solid var(--rule);background:transparent;border-radius:7px;padding:5px 10px;font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.mini:hover{border-color:var(--ink-3);color:var(--ink)}
.mini.join{background:var(--ember);border-color:var(--ember);color:#fff}
.mini.danger{border-color:color-mix(in srgb,var(--full) 55%,var(--rule));color:var(--full)}
.arow{display:grid;gap:6px;padding:10px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--paper)}
.arow .top{display:flex;align-items:center;gap:8px}
.arow .who{flex:1;font-weight:600}
.youare{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:14px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tag{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);margin-left:5px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .who{flex:1;font-weight:600}
.vibe{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);margin-bottom:10px}
.vibe .vibeicon{font-size:19px;line-height:1}
.vibe .vibelabel{flex:1;font-weight:600}
.vibe .vibescore{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-2)}
.perks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.perk{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.warn{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--rule));background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--ink-2)}
.inrow{display:flex;gap:7px}
.inrow input{flex:1;min-width:0}
.dice{border:1px solid var(--rule);background:var(--paper);border-radius:8px;width:46px;flex:0 0 auto;display:grid;place-items:center;font-size:18px;line-height:1}
.dice:hover{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,var(--paper))}
.dice.rolling{animation:roll .45s cubic-bezier(.3,1.4,.4,1)}
@keyframes roll{from{transform:rotate(0) scale(1)}55%{transform:rotate(220deg) scale(1.18)}to{transform:rotate(360deg) scale(1)}}
.tin{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;width:88px;text-align:center;letter-spacing:.12em}
.zrow .top{display:flex;align-items:baseline;gap:8px}
.zrow .zn{font-weight:600;font-size:15px;flex:1}
.zrow .cnt{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.zrow .blurb{font-size:13px;color:var(--ink-2);line-height:1.4}
.meter{height:5px;border-radius:99px;background:rgba(127,127,127,.22);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .4s cubic-bezier(.2,.7,.3,1)}
.meter i.warn{background:var(--warn)} .meter i.full{background:var(--full)}
.flagged{display:flex;align-items:center;gap:5px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
.stackav{display:flex;padding-left:5px}
.stackav .av{margin-left:-5px;box-shadow:0 0 0 2px var(--paper)}

.av{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:10px;font-weight:500;color:#fff;overflow:hidden;background:var(--dusk)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:44px;height:44px;font-size:15px}

.board{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--paper)}
.brow .rank{font-family:"Alfa Slab One",serif;font-size:16px;color:var(--ink-3);width:22px;text-align:center}
.brow .who{flex:1;font-weight:600}
.brow .val{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badge{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);opacity:.42}
.badge.got{opacity:1;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 9%,var(--paper))}
.badge .bi{font-size:19px;line-height:1.1}
.badge .bn{font-weight:600;font-size:14px}
.badge .bd{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.badge .bw{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--sun);margin-top:3px}
.section-h{display:flex;align-items:center;gap:9px;margin:20px 0 9px}
.section-h .line{flex:1;height:1px;background:var(--rule)}
.hint{font-size:12.5px;color:var(--ink-3)}

#menuBtn{display:none}
.hud{position:absolute;z-index:6;right:16px;top:16px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.hud .hudrow{display:flex;gap:7px}
.hbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);backdrop-filter:blur(8px);display:grid;place-items:center;box-shadow:var(--shadow);font-family:"DM Mono",monospace;font-size:16px;line-height:1}
.hbtn:hover{border-color:var(--dusk-soft)}
.hbtn.wide{width:auto;padding:0 13px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;height:34px}
.pill{height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--rule);background:var(--panel);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}
.dot.off{background:var(--ink-3);box-shadow:none}

.legend{position:absolute;left:16px;bottom:16px;z-index:6;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:99px;padding:7px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend .lr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.legend .k{width:13px;height:9px;border-radius:2px;flex:0 0 auto}

#toasts{position:absolute;z-index:9;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--rule);border-radius:99px;padding:8px 15px;box-shadow:var(--shadow);backdrop-filter:blur(8px);display:flex;align-items:center;gap:9px;font-size:14px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}

.marker{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;touch-action:none}
.marker.mine{cursor:grab}
.marker.dragging{cursor:grabbing;z-index:3}
.marker .body{position:relative;display:flex;align-items:center;gap:7px;background:var(--panel-solid);border:1.5px solid var(--pc,var(--dusk));border-radius:99px;padding:3px 11px 3px 4px;box-shadow:0 4px 12px rgba(10,20,10,.42);white-space:nowrap}
.marker .body::after{content:"";position:absolute;left:50%;bottom:-7px;width:0;height:0;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid var(--pc,var(--dusk))}
.marker .nm{font-size:12.5px;font-weight:600}
.marker .more{font-family:"DM Mono",monospace;font-size:10px;color:var(--ink-3)}
.marker .av{width:22px;height:22px;font-size:9px}
.marker.mine .body{box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 55%,transparent),0 4px 12px rgba(10,20,10,.42)}
.marker.bad .body{border-color:var(--full);box-shadow:0 0 0 3px color-mix(in srgb,var(--full) 45%,transparent)}
.marker.dragging .body{transform:scale(1.06)}
.marker.new{animation:drop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{0%{transform:translate(-50%,-190%) scale(.6);opacity:0}60%{transform:translate(-50%,-92%) scale(1.04)}100%{transform:translate(-50%,-100%) scale(1)}}

.zlabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;pointer-events:none;user-select:none;white-space:nowrap}
.zlabel .n{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--map-ink-2);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.zlabel .c{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--map-ink);text-shadow:0 1px 3px rgba(0,0,0,.85);margin-top:1px}
.site{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;user-select:none;text-align:center;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.site .t{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--map-ink);text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7);white-space:nowrap;margin-top:2px}
.site.big .t{font-family:"Alfa Slab One",serif;font-size:12px;letter-spacing:.01em;text-transform:none}
.site.sm .t{font-size:8.5px;letter-spacing:.08em;opacity:.92}
.site.sm .spot{width:4px;height:4px}
.site .spot{width:5px;height:5px;border-radius:50%;background:var(--map-ink);margin:1px auto 0;box-shadow:0 0 0 2px rgba(0,0,0,.45)}

#ghost{position:absolute;left:0;top:0;pointer-events:none;display:none}
#ghost.on{display:block}
#ghost .g{width:26px;height:26px;border-radius:50%;border:2px dashed var(--sun);transform:translate(-50%,-50%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.area{cursor:crosshair;transition:fill-opacity .18s}
.area:hover{fill-opacity:.36}
#stage.aiming{cursor:crosshair}
#stage.aiming .area{fill-opacity:.4}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(12,18,12,.55);display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex}
.sheet{width:min(430px,100%);max-height:min(88vh,720px);overflow-y:auto;background:var(--panel-solid);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);animation:rise .3s cubic-bezier(.2,1.1,.35,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet .hd{padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.sheet .hd h2{font-family:"Alfa Slab One",serif;font-size:22px;margin:3px 0 2px;line-height:1.1}
.sheet .bd{padding:16px 18px}
.sheet .ft{padding:12px 18px 16px;display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;border-top:1px solid var(--rule)}
.sheet.chat{display:flex;flex-direction:column;height:min(74dvh,640px);max-height:min(74dvh,640px);overflow:hidden}
.sheet.chat .hd,.sheet.chat .ft{flex:0 0 auto}
.sheet.chat .bd{flex:1 1 auto;overflow-y:auto;padding:14px 16px}
.chatlist{display:flex;flex-direction:column;gap:12px}
.cmsg{display:flex;gap:8px;align-items:flex-start}
.cmsg.mine{flex-direction:row-reverse;text-align:right}
.cmsg .cmeta{min-width:0;max-width:78%}
.cmsg.mine .cmeta{align-items:flex-end;display:flex;flex-direction:column}
.cmsg .who{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.cmsg .when{font-family:"DM Mono",monospace;font-size:9.5px;color:var(--ink-3);margin-left:6px}
.camptag{font-weight:400;color:var(--ink-3);font-size:11px}
.cmsg .bubble{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.4;word-break:break-word;display:inline-block}
.cmsg.mine .bubble{background:color-mix(in srgb,var(--ember) 16%,var(--paper));border-color:color-mix(in srgb,var(--ember) 40%,var(--rule))}
.composer{display:flex;gap:8px;align-items:center;width:100%}
.composer input[type=text]{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:99px;padding:10px 15px}
.composer button{flex:0 0 auto}
.fld{display:grid;gap:5px;margin-bottom:13px}
.fld label{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.fld input[type=text],.fld textarea,.fld select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;width:100%}
.fld textarea{resize:vertical;min-height:56px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:9px 15px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 10px;font-size:15px;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--paper))}
.cchip{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.cchip[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.seg{display:flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:var(--paper);border:0;padding:8px 6px;font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ember);color:#fff}
#confetti{position:absolute;inset:0;z-index:8;pointer-events:none}
#moveBar{position:absolute;z-index:10;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--sun);border-radius:99px;padding:8px 10px 8px 16px;box-shadow:var(--shadow);backdrop-filter:blur(8px);font-size:14px}
#moveBar[hidden]{display:none}

#railToggle{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:12;max-height:min(62dvh,62vh);border-right:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:var(--shadow);transform:translateY(calc(100% - 116px));transition:transform .3s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
  #rail.open{transform:none}
  #railToggle{display:block;position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:64px;height:22px;border:0;background:none}
  #railToggle::after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40px;height:4px;border-radius:99px;background:var(--ink-3)}
  .legend{display:none}
  #menuBtn{display:grid;place-items:center;position:absolute;z-index:7;right:16px;top:16px;margin-top:env(safe-area-inset-top)}
  .hud{display:none;position:absolute;z-index:7;right:16px;top:calc(16px + env(safe-area-inset-top) + 48px);flex-direction:column;align-items:stretch;gap:8px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--rule);border-radius:12px;padding:10px;box-shadow:var(--shadow);width:172px}
  .hud.open{display:flex}
  .hud .pill{width:100%;justify-content:center}
  .hud .hudrow .hbtn{flex:1}
  .hud .hbtn.wide{width:100%}
  .sheet.chat{height:min(80dvh,640px);max-height:min(80dvh,640px)}
  .sheet{padding-bottom:env(safe-area-inset-bottom)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<div id="app">
  <aside id="rail">
    <button id="railToggle" aria-label="Toggle panel"></button>
    <div class="plate">
      <div class="eyebrow">Otis Mountain &middot; Elizabethtown NY</div>
      <h1 class="wordmark">Where you<br>camping<span>?</span></h1>
      <div class="eyebrow mono">44&deg;11&prime;29&Prime;N 73&deg;36&prime;04&Prime;W</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-pane="camps">Camps</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="roster">Roster</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="badges">Badges</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="admin" id="adminTab" hidden>Admin</button>
    </div>
    <div class="panes">
      <div class="pane on" id="pane-camps">
        <div id="youCard"></div>
        <div class="section-h"><span class="eyebrow">Camps</span><span class="line"></span><span class="eyebrow mono" id="totalCount">0 camps</span></div>
        <div class="zlist" id="zlist"></div>
      </div>
      <div class="pane" id="pane-roster">
        <div class="section-h"><span class="eyebrow">Everyone on the mountain</span><span class="line"></span></div>
        <div class="board" id="roster"></div>
      </div>
      <div class="pane" id="pane-admin">
        <div class="warn">Only you can see this. It hides controls, it doesn't lock anything down.</div>
        <div class="section-h"><span class="eyebrow">Every camp</span><span class="line"></span></div>
        <div class="board" id="adminCamps"></div>
        <div class="section-h"><span class="eyebrow">Everyone</span><span class="line"></span></div>
        <div class="board" id="adminPeople"></div>
        <div class="section-h"><span class="eyebrow">Export</span><span class="line"></span></div>
        <div class="rowacts"><button class="mini" id="expCsv">Download CSV</button><button class="mini" id="expCopy">Copy roster</button></div>
      </div>
      <div class="pane" id="pane-badges">
        <div class="section-h"><span class="eyebrow">Your badges</span><span class="line"></span><span class="eyebrow mono" id="badgeCount">0/7</span></div>
        <div class="board" id="badges"></div>
      </div>
    </div>
  </aside>

  <div id="stage">
    <div id="world">
      <canvas id="canopy"></canvas>
      <svg id="terrain" aria-label="Site map of Otis Mountain"></svg>
      <div id="overlay"><div id="ghost" class="anchor"><div class="counter"><div class="g"></div></div></div></div>
    </div>
    <canvas id="confetti"></canvas>
    <div id="moveBar" hidden><span id="moveTxt">Tap a new spot</span><button class="mini" id="moveCancel">Cancel</button></div>
    <div id="toasts"></div>
    <button class="hbtn" id="menuBtn" aria-label="Map controls" aria-expanded="false" title="Map controls">&#9776;</button>
    <div class="hud" id="hud">
      <div class="pill" id="livePill"><span class="dot off"></span><span id="liveTxt">solo</span></div>
      <div class="hudrow">
        <button class="hbtn" id="soundBtn" aria-label="Toggle sound" title="Sound">&#9834;</button>
        <button class="hbtn" id="zin" aria-label="Zoom in">+</button>
        <button class="hbtn" id="zout" aria-label="Zoom out">&minus;</button>
      </div>
      <button class="hbtn wide" id="fit">Fit map</button>
      <button class="hbtn wide" id="globalChatBtn">💬 Global Chat</button>
    </div>
    <div class="legend">
      <div class="lr"><span class="k" style="background:var(--field)"></span>Clearing</div>
      <div class="lr"><span class="k" style="background:var(--dirt)"></span>Bare ground</div>
      <div class="lr"><span class="k" style="background:var(--trail)"></span>Main path</div>
      <div class="lr"><span class="k" style="background:color-mix(in srgb,var(--dusk) 60%,transparent);border:1px dashed var(--dusk-soft)"></span>Camping area</div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

function inPoly(x,y,pts){
  var inside=false;
  for(var i=0,j=pts.length-1;i<pts.length;j=i++){
    var xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];

  }
  return inside;
}

/* ---------- canopy shading, straight off the satellite luminance ---------- */
(function drawCanopy(){
  var c=document.getElementById("canopy"), gw=DATA.CANOPY_W, gh=DATA.CANOPY_H;
  c.style.width=MW+"px"; c.style.height=MH+"px";
  c.width=gw*4; c.height=gh*4;
  var bin=atob(DATA.CANOPY);
  var src=document.createElement("canvas"); src.width=gw; src.height=gh;
  var sg=src.getContext("2d"), id=sg.createImageData(gw,gh), d=id.data;
  for(var i=0;i<gw*gh;i++){
    var n=bin.charCodeAt(i)/255, v=(n-0.5);
    var light = v>0;
    d[i*4]=light?255:0; d[i*4+1]=light?255:0; d[i*4+2]=light?235:0;
    d[i*4+3]=Math.min(255,Math.abs(v)*(light?215:245));
  }
  sg.putImageData(id,0,0);
  var g=c.getContext("2d");
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
  g.drawImage(src,0,0,c.width,c.height);
})();

/* ---------- transform: pan + zoom only, no rotation ---------- */
var stage=document.getElementById("stage"), world=document.getElementById("world"),
    overlay=document.getElementById("overlay");
var T={x:0,y:0,k:1}, MIN_K=0.24, MAX_K=5;
function applyT(){
  world.style.transform="translate("+T.x+"px,"+T.y+"px) scale("+T.k+")";
  world.style.setProperty("--cr","scale("+(1/T.k)+")");
  updateLabelVis();
}
function toMap(sx,sy){
  var rect=stage.getBoundingClientRect();
  return { x:(sx-rect.left-T.x)/T.k, y:(sy-rect.top-T.y)/T.k };
}
function setZoomAbout(sx,sy,k){
  k=Math.max(MIN_K,Math.min(MAX_K,k));
  var rect=stage.getBoundingClientRect(), p=toMap(sx,sy);
  T.x=(sx-rect.left)-p.x*k; T.y=(sy-rect.top)-p.y*k; T.k=k; applyT();
}
var FOCUS={x:70,y:0,w:1180,h:MH};   /* the built-up part of the site */
function fit(){
  var w=stage.clientWidth,h=stage.clientHeight,pad=26;
  T.k=Math.max(MIN_K,Math.min(MAX_K,Math.min((w-pad*2)/FOCUS.w,(h-pad*2)/FOCUS.h)));
  T.x=w/2-(FOCUS.x+FOCUS.w/2)*T.k; T.y=h/2-(FOCUS.y+FOCUS.h/2)*T.k; applyT();
}
function flyTo(mx,my,k,ms){
  ms=ms||760;
  var w=stage.clientWidth,h=stage.clientHeight;
  var to={k:k,x:w/2-mx*k,y:h/2-my*k};
  var from={x:T.x,y:T.y,k:T.k}, t0=performance.now();
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ T.x=to.x;T.y=to.y;T.k=to.k;applyT();return; }
  (function step(now){
    var p=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-p,3);
    T.x=from.x+(to.x-from.x)*e; T.y=from.y+(to.y-from.y)*e; T.k=from.k+(to.k-from.k)*e;
    applyT(); if(p<1) requestAnimationFrame(step);
  })(performance.now());
}
var ptrs=new Map(), gesture=null, moved=0;
var tapPos=null;
stage.addEventListener("pointerdown",function(e){
  if(e.target.closest(".hud,#menuBtn,.legend,#toasts,#moveBar")) return;
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0;
  if(ptrs.size===1) tapPos={x:e.clientX,y:e.clientY};
  if(ptrs.size===1){ gesture={type:"pan"}; stage.classList.add("dragging"); }
  else if(ptrs.size===2){
    var p=Array.from(ptrs.values());
    gesture={type:"pinch",d:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),k0:T.k,
      mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,x0:T.x,y0:T.y};
  }
});
stage.addEventListener("pointermove",function(e){
  if(!ptrs.has(e.pointerId)||!gesture) return;
  var prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gesture.type==="pan"&&ptrs.size===1){
    var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    moved+=Math.abs(dx)+Math.abs(dy); T.x+=dx; T.y+=dy; applyT();
  } else if(gesture.type==="pinch"&&ptrs.size===2){
    var p=Array.from(ptrs.values());
    var d=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);
    var cx=(p[0].x+p[1].x)/2, cy=(p[0].y+p[1].y)/2; moved+=12;
    T.x+=cx-gesture.mx; T.y+=cy-gesture.my; gesture.mx=cx; gesture.my=cy;
    setZoomAbout(cx,cy,gesture.k0*(d/gesture.d));
  }
});
function endPtr(e){
  var wasSingle = ptrs.size===1 && tapPos;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){ gesture=null; stage.classList.remove("dragging"); }
  else if(ptrs.size===1) gesture={type:"pan"};
  if(e.type==="pointerup" && wasSingle && moved<=7 && typeof handleTap==="function") handleTap(e.clientX,e.clientY);
  if(ptrs.size===0) tapPos=null;
}
stage.addEventListener("pointerup",endPtr);
stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",function(e){
  e.preventDefault();
  setZoomAbout(e.clientX,e.clientY,T.k*Math.pow(0.9988,e.deltaY*(e.ctrlKey?3:1)));
},{passive:false});
function ctr(){ var b=stage.getBoundingClientRect(); return [b.left+stage.clientWidth/2, b.top+stage.clientHeight/2]; }
document.getElementById("zin").onclick=function(){ var c=ctr(); setZoomAbout(c[0],c[1],T.k*1.45); };
document.getElementById("zout").onclick=function(){ var c=ctr(); setZoomAbout(c[0],c[1],T.k/1.45); };

var menuBtn=document.getElementById("menuBtn"), hud=document.getElementById("hud");
menuBtn.onclick=function(e){
  e.stopPropagation();
  var open=hud.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded",open?"true":"false");
};
document.addEventListener("click",function(e){
  if(hud.classList.contains("open") && !hud.contains(e.target) && e.target!==menuBtn){
    hud.classList.remove("open"); menuBtn.setAttribute("aria-expanded","false");
  }
});
window.addEventListener("keydown",function(e){
  if(document.getElementById("scrim").classList.contains("on")||e.target.matches("input,textarea")) return;
  var s=60;
  if(e.key==="ArrowLeft")T.x+=s; else if(e.key==="ArrowRight")T.x-=s;
  else if(e.key==="ArrowUp")T.y+=s; else if(e.key==="ArrowDown")T.y-=s;
  else if(e.key==="+"||e.key==="=")return document.getElementById("zin").click();
  else if(e.key==="-")return document.getElementById("zout").click();
  else if(e.key==="0")return fit();
  else return;
  applyT(); e.preventDefault();
});

var NAME_GERUND = ["Aggressively Vibing","Structurally Chilling","Somewhere In The Woods",
  "Casually Overcommitted","Professionally Loitering","Emotionally Camping","Currently Horizontal",
  "Committed to the Bit","Sleeping On It","Running On Fumes","Powered By Snacks",
  "Not Making It To Breakfast","Here For The Whole Thing"];

var _nameSeen=[];
function pick(a){ return a[(Math.random()*a.length)|0]; }
function randomCampName(){
  for(var tries=0; tries<24; tries++){
    var r=Math.random(), n;
    if(r<0.42)      n = pick(NAME_GEMS);
    else if(r<0.56) n = "The "+pick(NAME_ADJ)+" "+pick(NAME_GROUP);
    else if(r<0.68) n = "The "+pick(NAME_ADJ)+" "+pick(NAME_THING);
    else if(r<0.80) n = pick(NAME_THING)+" "+pick(NAME_GROUP);
    else if(r<0.90) n = "Camp "+(Math.random()<0.5?pick(NAME_ADJ):pick(NAME_THING));
    else            n = pick(NAME_GERUND);
    if(n.length<=26 && _nameSeen.indexOf(n)<0){
      _nameSeen.push(n); if(_nameSeen.length>40) _nameSeen.shift();
      return n;
    }
  }
  return pick(NAME_GEMS);
}

var MEKEY = ls("otis.key")||(function(){var k="k"+Math.random().toString(36).slice(2)+Date.now().toString(36); ls("otis.key",k); return k;})();

/* ---------- store: camps + people ----------
   Three backends behind the same four verbs:
     Supabase   when CONFIG is filled in   (public, shared, what you deploy)
     Claude db  inside a Claude artifact   (org-only)
     localStorage otherwise                (offline, just this browser)
------------------------------------------------ */
var CAMPS=[], PEOPLE=[], MESSAGES=[], chatReady=true, dbRef=null, roomRef=null, SB=null;

function localLoad(){
  try{ CAMPS=JSON.parse(localStorage.getItem("otis.camps")||"[]"); }catch(e){ CAMPS=[]; }
  try{ PEOPLE=JSON.parse(localStorage.getItem("otis.people")||"[]"); }catch(e){ PEOPLE=[]; }
  try{ MESSAGES=JSON.parse(localStorage.getItem("otis.messages")||"[]"); }catch(e){ MESSAGES=[]; }
}
function localSave(){
  try{
    localStorage.setItem("otis.camps",JSON.stringify(CAMPS));
    localStorage.setItem("otis.people",JSON.stringify(PEOPLE));
    localStorage.setItem("otis.messages",JSON.stringify(MESSAGES));
  }catch(e){}
}
function upsert(arr,o){ return arr.filter(function(q){return q.id!==o.id;}).concat([o]); }

function reportDb(e){
  toast("⚠️", e&&e.code==="quota_exceeded" ? "The map is full — take down an empty camp first."
    : e&&e.code==="resource_exhausted" ? "Too many changes at once. Give it a second."
    : "That didn't save. Try again in a moment.");
}
function sbErr(e){
  if(!e) return;
  toast("⚠️", "Couldn't save that — check your connection and try again.");
  if(window.console) console.error("supabase:", e.message||e);
}

/* row <-> object: the database is snake_case, the app is camelCase */
function campToRow(c){ return {id:c.id,name:c.name,color:c.color,note:c.note||"",x:c.x,y:c.y,area:c.area,founder:c.founder||"",ts:c.ts}; }
function rowToCamp(r){ return {id:r.id,name:r.name,color:r.color,note:r.note||"",x:r.x,y:r.y,area:r.area,founder:r.founder||"",ts:r.ts}; }
function personToRow(p){ return {id:p.id,camp_id:p.campId||null,name:p.name,initials:p.initials||"",emoji:p.emoji||"",photo:p.photo||"",ts:p.ts}; }
function rowToPerson(r){ return {id:r.id,campId:r.camp_id||"",name:r.name,initials:r.initials||"",emoji:r.emoji||"",photo:r.photo||"",ts:r.ts}; }
function messageToRow(m){ return {id:m.id,camp_id:m.campId,person_id:m.personId,text:m.text,ts:m.ts}; }
function rowToMessage(r){ return {id:r.id,campId:r.camp_id,personId:r.person_id,text:r.text,ts:r.ts}; }

var refetchTimer=null;
function refetchSoon(){ clearTimeout(refetchTimer); refetchTimer=setTimeout(refetchAll,250); }
function refetchAll(){
  if(!SB) return;
  var calls=[SB.from("camps").select("*"), SB.from("people").select("*")];
  if(chatReady) calls.push(SB.from("messages").select("*"));
  Promise.all(calls).then(function(r){
    if(r[0].error) return sbErr(r[0].error);
    if(r[1].error) return sbErr(r[1].error);
    var known={}; PEOPLE.forEach(function(p){ known[p.id]=1; });
    var had=PEOPLE.length;
    CAMPS=(r[0].data||[]).map(rowToCamp);
    PEOPLE=(r[1].data||[]).map(rowToPerson);
    if(r[2]){ if(r[2].error) chatReady=false; else MESSAGES=(r[2].data||[]).map(rowToMessage); }
    if(had) PEOPLE.forEach(function(p){
      if(!known[p.id] && p.id!==MEKEY && Date.now()-(p.ts||0)<60000) announce(p);
    });
    renderAll(); renderChat();
  }, sbErr);
}

function putCamp(c){
  CAMPS=upsert(CAMPS,c); renderAll();
  if(SB) SB.from("camps").upsert(campToRow(c)).then(function(r){ if(r&&r.error) sbErr(r.error); refetchSoon(); }, sbErr);
  else if(dbRef) dbRef.doc("camps/"+c.id).set(c).catch(reportDb);
  else localSave();
}
function delCamp(id){
  CAMPS=CAMPS.filter(function(q){return q.id!==id;}); renderAll();
  if(SB) SB.from("camps").delete().eq("id",id).then(function(r){ if(r&&r.error) sbErr(r.error); refetchSoon(); }, sbErr);
  else if(dbRef) dbRef.doc("camps/"+id).delete().catch(reportDb);
  else localSave();
}
function putPerson(p){
  PEOPLE=upsert(PEOPLE,p); renderAll();
  if(SB) SB.from("people").upsert(personToRow(p)).then(function(r){ if(r&&r.error) sbErr(r.error); refetchSoon(); }, sbErr);
  else if(dbRef) dbRef.doc("people/"+p.id).set(p).catch(reportDb);
  else localSave();
}
function delPerson(id){
  PEOPLE=PEOPLE.filter(function(q){return q.id!==id;}); renderAll();
  if(SB) SB.from("people").delete().eq("id",id).then(function(r){ if(r&&r.error) sbErr(r.error); refetchSoon(); }, sbErr);
  else if(dbRef) dbRef.doc("people/"+id).delete().catch(reportDb);
  else localSave();
}
function putMessage(m){
  MESSAGES=upsert(MESSAGES,m); renderChat();
  if(SB) SB.from("messages").upsert(messageToRow(m)).then(function(r){
    if(r&&r.error){ chatReady=false; sbErr(r.error); } else { chatReady=true; refetchSoon(); }
  }, function(e){ chatReady=false; sbErr(e); });
  else if(dbRef) dbRef.doc("messages/"+m.id).set(m).catch(reportDb);
  else localSave();
}
localLoad();

function loadSupabase(cb){
  if(!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) return cb(null);
  if(window.supabase && window.supabase.createClient)
    return cb(window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY));
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
  s.onload=function(){
    try{ cb(window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)); }
    catch(e){ cb(null); }
  };
  s.onerror=function(){ cb(null); };
  document.head.appendChild(s);
}

(function connect(){
  loadSupabase(function(client){
    if(client){
      SB=client; CAMPS=[]; PEOPLE=[]; MESSAGES=[];
      setLive(true,"shared map");
      refetchAll();
      try{
        SB.channel("otis")
          .on("postgres_changes",{event:"*",schema:"public",table:"camps"},refetchSoon)
          .on("postgres_changes",{event:"*",schema:"public",table:"people"},refetchSoon)
          .on("postgres_changes",{event:"*",schema:"public",table:"messages"},refetchSoon)
          .subscribe();
      }catch(e){}
      setInterval(refetchAll, 20000);   // belt and braces if the socket drops
      return;
    }
    if(CONFIG.SUPABASE_URL) toast("⚠️","Couldn't reach the database — your changes are saved locally only.");
    claudeConnect();
  });
})();

async function claudeConnect(){
  if(!window.claude||!window.claude.use) return;
  try{
    var db=await window.claude.use("db");
    if(db){
      dbRef=db;
      db.collection("camps").limit(600).onSnapshot(function(s){
        CAMPS=s.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; }); renderAll();
      },function(){});
      db.collection("people").limit(1000).onSnapshot(function(s){
        var had=PEOPLE.length;
        PEOPLE=s.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; });
        if(had) s.docChanges().forEach(function(ch){
          if(ch.type==="added"&&!ch.doc.metadata.hasPendingWrites){
            var p=ch.doc.data()||{};
            if(p.id!==MEKEY&&Date.now()-(p.ts||0)<60000) announce(p);
          }
        });
        renderAll();
      },function(){});
      db.collection("messages").limit(3000).onSnapshot(function(s){
        MESSAGES=s.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; }); renderChat();
      },function(){});
      setLive(true,"shared map");
    }
  }catch(e){}
  try{
    var room=await window.claude.use("room");
    if(room){
      roomRef=room;
      room.onPeers(function(pp){ var n=(pp&&pp.length)||0; setLive(true, n>1?n+" here now":"shared map"); });
      room.presence({at:Date.now()});
      room.on("planted",function(m){ if(m&&m.data&&m.data.by!==MEKEY) burst(); });
    }
  }catch(e){}
}
function setLive(on,txt){ document.querySelector("#livePill .dot").classList.toggle("off",!on); document.getElementById("liveTxt").textContent=txt; }
function announce(p){
  var c=campById(p.campId);
  toast(p.emoji||"⛺", esc(p.name||"Someone")+(c?" joined "+esc(c.name):" arrived"));
  burst();
}

/* ---------- lookups ---------- */
function me(){ for(var i=0;i<PEOPLE.length;i++) if(PEOPLE[i].id===MEKEY) return PEOPLE[i]; return null; }
function campById(id){ for(var i=0;i<CAMPS.length;i++) if(CAMPS[i].id===id) return CAMPS[i]; return null; }
function membersOf(id){ return PEOPLE.filter(function(p){return p.campId===id;}); }
function myCamp(){ var m=me(); return m?campById(m.campId):null; }
function inMyCamp(c){ var m=me(); return !!(m&&c&&m.campId===c.id); }
function areaAt(x,y){ for(var i=0;i<AREAS.length;i++) if(inPoly(x,y,AREAS[i].pts)) return AREAS[i]; return null; }
function campColor(c){ return (c&&c.color)||CAMP_COLORS[0]; }
function messagesOf(id){ return MESSAGES.filter(function(m){return m.campId===id;}).sort(function(a,b){return (a.ts||0)-(b.ts||0);}); }
function relTime(ts){
  var s=Math.max(0,Math.round((Date.now()-(ts||0))/1000));
  if(s<45) return "just now";
  var m=Math.round(s/60); if(m<60) return m+"m ago";
  var h=Math.round(m/60); if(h<24) return h+"h ago";
  return Math.round(h/24)+"d ago";
}

/* ---------- camp perks & vibe score ----------
   Proximity to water / drugs / artsy things, plus a flat regional
   perk for the two areas on each side of the main path. Purely a
   for-fun scoring layer — geometry only, nothing here touches DATA. */
function landmarkById(id){ for(var i=0;i<LANDMARKS.length;i++) if(LANDMARKS[i].id===id) return LANDMARKS[i]; return null; }
function mapDist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }
function proximityPerk(c,lmId,icon,label){
  var lm=landmarkById(lmId); if(!lm) return null;
  var d=mapDist(c.x,c.y,lm.x,lm.y);
  if(d<100) return {icon:icon,label:label+": right there",pts:3};
  if(d<220) return {icon:icon,label:label+": short walk",pts:2};
  if(d<380) return {icon:icon,label:label+": nearby",pts:1};
  return null;
}
var RIGHT_SIDE_AREAS={a0:1,a1:1}, LEFT_SIDE_AREAS={a2:1,a3:1};
function campPerks(c){
  var perks=[];
  [proximityPerk(c,"water","\u{1F4A7}","Water"),
   proximityPerk(c,"drugs","\u{1F343}","Drugs"),
   proximityPerk(c,"art","\u{1F3A8}","Artsy Things")
  ].forEach(function(p){ if(p) perks.push(p); });
  if(RIGHT_SIDE_AREAS[c.area]){
    perks.push({icon:"\u{1F319}",label:"Late night vibes",pts:1});
    perks.push({icon:"\u{1F476}",label:"Fewer kids around",pts:1});
  } else if(LEFT_SIDE_AREAS[c.area]){
    perks.push({icon:"\u{1F3B6}",label:"Short walk to the music",pts:1});
    perks.push({icon:"\u{1F697}",label:"Short walk to your car",pts:1});
  }
  var total=perks.reduce(function(t,p){return t+p.pts;},0);
  var tier = total>=9?"Legendary":total>=6?"Prime":total>=3?"Solid":"Rustic";
  var tierIcon = total>=9?"\u{1F451}":total>=6?"\u{1F525}":total>=3?"\u{1F44D}":"\u{1F3D5}️";
  return { perks:perks, total:total, tier:tier, tierIcon:tierIcon };
}

/* ---------- avatars ---------- */
function avatarHTML(p,cls,col){
  col = col || "var(--dusk)";
  if(!p) return '<span class="av '+(cls||"")+'" style="background:'+esc(col)+'">?</span>';
  if(p.photo) return '<span class="av '+(cls||"")+'" style="background:'+esc(col)+'"><img src="'+esc(p.photo)+'" alt=""></span>';
  if(p.emoji) return '<span class="av '+(cls||"")+'" style="background:'+esc(col)+'">'+p.emoji+'</span>';
  return '<span class="av '+(cls||"")+'" style="background:'+esc(col)+'">'+esc(p.initials||initialsOf(p.name))+'</span>';
}

/* ---------- markers ---------- */
var markerLayer=document.createElement("div");
markerLayer.style.cssText="position:absolute;left:0;top:0;width:"+MW+"px;height:"+MH+"px";
overlay.appendChild(markerLayer);
var lastIds=new Set(), drag=null;

function renderMarkers(){
  markerLayer.textContent=""; var seen=new Set();
  CAMPS.slice().sort(function(a,b){return a.y-b.y;}).forEach(function(c){
    seen.add(c.id);
    var mem=membersOf(c.id), mine=inMyCamp(c), col=campColor(c);
    var a=document.createElement("div"); a.className="anchor"; a.style.left=c.x+"px"; a.style.top=c.y+"px";
    var w=document.createElement("div"); w.className="counter";
    var mk=document.createElement("div");
    mk.className="marker"+(mine?" mine":"")+(lastIds.size&&!lastIds.has(c.id)?" new":"");
    mk.style.setProperty("--pc",col);
    mk.setAttribute("tabindex","0");
    mk.setAttribute("role","button");
    mk.setAttribute("aria-label",c.name+", "+mem.length+" camping");
    var avs = mem.slice(0,3).map(function(p){ return avatarHTML(p,"",col); }).join("");
    if(!avs) avs='<span class="av" style="background:'+esc(col)+'">⛺</span>';
    mk.innerHTML='<div class="body"><span class="stackav">'+avs+'</span><span class="nm">'+esc(c.name)+'</span>'
      +(mem.length>3?'<span class="more">+'+(mem.length-3)+'</span>':'')+'</div>';
    mk.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openCampSheet(c); } });
    mk.addEventListener("pointerdown",function(e){
      e.stopPropagation();
      mk.setPointerCapture(e.pointerId);
      var st=toMap(e.clientX,e.clientY);
      drag={id:c.id, sx:st.x, sy:st.y, ox:c.x, oy:c.y, nx:c.x, ny:c.y, dist:0, can:mine, node:a};
    });
    mk.addEventListener("pointermove",function(e){
      if(!drag||drag.id!==c.id) return;
      var m=toMap(e.clientX,e.clientY);
      drag.dist=Math.hypot(m.x-drag.sx,m.y-drag.sy);
      if(!drag.can||drag.dist<5) return;
      mk.classList.add("dragging");
      drag.nx=drag.ox+(m.x-drag.sx); drag.ny=drag.oy+(m.y-drag.sy);
      a.style.left=drag.nx+"px"; a.style.top=drag.ny+"px";
      var ok=!!areaAt(drag.nx,drag.ny);
      mk.classList.toggle("bad",!ok);
    });
    mk.addEventListener("pointerup",function(e){
      if(!drag||drag.id!==c.id) return;
      var d=drag; drag=null; mk.classList.remove("dragging","bad");
      if(!d.can||d.dist<5){ openCampSheet(c); return; }
      var ar=areaAt(d.nx,d.ny);
      if(ar){ c.x=Math.round(d.nx); c.y=Math.round(d.ny); c.area=ar.id; putCamp(c); thunk(); toast("\u{1F4CD}","Camp moved."); }
      else { toast("\u{1F6AB}","Camps have to sit inside a dashed camping area."); renderAll(); }
    });
    mk.addEventListener("pointercancel",function(){ drag=null; mk.classList.remove("dragging","bad"); renderAll(); });
    w.appendChild(mk); a.appendChild(w); markerLayer.appendChild(a);
  });
  lastIds=seen;
}

function renderAreas(){
  AREAS.forEach(function(z){
    var cs=CAMPS.filter(function(c){return c.area===z.id;});
    var n=cs.reduce(function(t,c){ return t+membersOf(c.id).length; },0);
    var lab=areaLabels[z.id];
    lab.querySelector("[data-c]").textContent = cs.length
      ? cs.length+(cs.length===1?" camp · ":" camps · ")+n+(n===1?" person":" people")
      : "no camps yet";
    if(z.el) z.el.setAttribute("fill-opacity", cs.length?".16":".22");
  });
}

/* ---------- badges ---------- */
var BADGES=[
  { id:"first",  ic:"\u{1F31E}", n:"First Light",   d:"Drop the very first camp on the map." },
  { id:"blaze",  ic:"\u{1F6A9}", n:"Trailblazer",   d:"Be the first camp in one of the four areas." },
  { id:"deep",   ic:"\u{1F332}", n:"Deep Woods",    d:"Camp in one of the two areas east of the path." },
  { id:"squad",  ic:"\u{1F465}", n:"Squad Goals",   d:"Be in a camp five or more deep." },
  { id:"open",   ic:"\u{1F6AA}", n:"Open Door",     d:"Somebody joins a camp you started." },
  { id:"face",   ic:"\u{1F4F8}", n:"Show Your Face",d:"Use a photo instead of initials." },
  { id:"talker", ic:"\u{1F4AC}", n:"Leave a Note",  d:"Say what to look for at your camp." }
];
var FAR_AREAS={a0:1,a1:1};
function earned(){
  var m=me(), c=myCamp(), got={};
  if(!m) return got;
  if(m.photo) got.face=true;
  if(!c) return got;
  if(c.note) got.talker=true;
  var mem=membersOf(c.id);
  if(mem.length>=5) got.squad=true;
  if(FAR_AREAS[c.area]) got.deep=true;
  var byTime=CAMPS.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  if(byTime[0]&&byTime[0].founder===MEKEY) got.first=true;
  CAMPS.forEach(function(x){
    if(x.founder!==MEKEY) return;
    var older=CAMPS.filter(function(y){ return y.area===x.area && (y.ts||0)<(x.ts||0); });
    if(!older.length) got.blaze=true;
    if(membersOf(x.id).some(function(p){ return p.id!==MEKEY; })) got.open=true;
  });
  return got;
}
function renderBadges(){
  var got=earned(), n=0;
  document.getElementById("badges").innerHTML=BADGES.map(function(b){
    var has=!!got[b.id]; if(has) n++;
    return '<div class="badge'+(has?" got":"")+'"><span class="bi">'+b.ic+'</span><div>'
      +'<div class="bn">'+esc(b.n)+'</div><div class="bd">'+esc(b.d)+'</div>'
      +(has?'<div class="bw">Earned</div>':'')+'</div></div>';
  }).join("");
  document.getElementById("badgeCount").textContent=n+"/"+BADGES.length;
}

/* mark picker, shared by every sheet that edits a person */
function markPicker(box,d,onChange){
  function paint(){
    if(d.mode==="initials"){
      box.innerHTML='<input type="text" class="tin" id="mk" maxlength="3" value="'+esc(d.initials||initialsOf(d.name))+'">';
      box.querySelector("#mk").oninput=function(){ d.initials=this.value.toUpperCase(); onChange&&onChange(); };
    } else if(d.mode==="emoji"){
      box.innerHTML='<div class="chips">'+EMOJI.map(function(e){
        return '<button type="button" class="chip" data-e="'+e+'" aria-pressed="'+(d.emoji===e)+'">'+e+'</button>'; }).join("")+'</div>';
      Array.prototype.forEach.call(box.querySelectorAll("[data-e]"),function(b){
        b.onclick=function(){ d.emoji=b.dataset.e;
          Array.prototype.forEach.call(box.querySelectorAll(".chip"),function(c){ c.setAttribute("aria-pressed",c.dataset.e===d.emoji); });
          onChange&&onChange(); };
      });
    } else {
      box.innerHTML='<div style="display:flex;gap:12px;align-items:center">'
        +(d.photo?'<span class="av lg"><img src="'+esc(d.photo)+'" alt=""></span>':'<span class="av lg" style="background:var(--ink-3)">\u{1F4F7}</span>')
        +'<label class="btn" style="cursor:pointer">Choose photo<input type="file" accept="image/*" id="mkf" hidden></label></div>'
        +'<div class="hint" style="margin-top:6px">Cropped square and shrunk to a thumbnail before it saves.</div>';
      box.querySelector("#mkf").onchange=function(){
        var f=this.files&&this.files[0]; if(f) shrink(f,function(u){ d.photo=u; paint(); onChange&&onChange(); });
      };
    }
  }
  paint(); return paint;
}
function modeSegHTML(d){
  return '<div class="seg" data-seg>'
    +'<button type="button" data-mode="initials" aria-pressed="'+(d.mode==="initials")+'">Initials</button>'
    +'<button type="button" data-mode="emoji" aria-pressed="'+(d.mode==="emoji")+'">Emoji</button>'
    +'<button type="button" data-mode="photo" aria-pressed="'+(d.mode==="photo")+'">Selfie</button></div>';
}
function wireSeg(d,repaint){
  var seg=sheet.querySelector("[data-seg]"); if(!seg) return;
  seg.onclick=function(e){
    var b=e.target.closest("[data-mode]"); if(!b) return;
    d.mode=b.dataset.mode;
    Array.prototype.forEach.call(seg.children,function(x){ x.setAttribute("aria-pressed",x.dataset.mode===d.mode); });
    repaint();
  };
}
function shrink(file,cb){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var S=160,cv=document.createElement("canvas"); cv.width=S;cv.height=S;
    var g=cv.getContext("2d"), s=Math.min(img.width,img.height);
    g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);
    URL.revokeObjectURL(url); cb(cv.toDataURL("image/jpeg",0.72));
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast("⚠️","Couldn't read that image."); };
  img.src=url;
}
function draftFromMe(){
  var m=me()||{};
  return { name:m.name||"", initials:m.initials||"", emoji:m.emoji||"", photo:m.photo||"",
           mode: m.photo?"photo":(m.emoji?"emoji":"initials") };
}
function saveMe(d,campId){
  var p={ id:MEKEY, campId:campId, name:d.name.trim(),
    initials: d.mode==="initials"?(d.initials||initialsOf(d.name)):"",
    emoji: d.mode==="emoji"?(d.emoji||""):"",
    photo: d.mode==="photo"?(d.photo||""):"",
    ts: (me()||{}).ts || Date.now() };
  putPerson(p); return p;
}

    closeSheet(); flyTo(c.x,c.y,Math.max(T.k,1.7)); burst(); thunk();

    var old=myCamp();
    saveMe(d,c.id);
    if(old && old.id!==c.id && membersOf(old.id).filter(function(p){return p.id!==MEKEY;}).length===0) delCamp(old.id);
    closeSheet(); flyTo(c.x,c.y,Math.max(T.k,1.6)); burst(); thunk();
    toast("⛺","You're at "+c.name+".");
    if(roomRef){ try{ roomRef.emit("planted",{by:MEKEY}); }catch(e){} }
    if(!dbRef) renderAll();
  };
  scrim.classList.add("on");
  sheet.querySelector("#yn").focus();
}

function openRename(c){
  sheet.innerHTML='<div class="hd"><div class="eyebrow">Camp</div><h2>Rename</h2>'
    +'<div class="hint">Anyone camping here can change this.</div></div>'
    +'<div class="bd">'
    +'<div class="fld"><label for="cn">Camp name</label>'+nameFieldHTML("cn",c.name,"The Griddle Boys")+'</div>'
    +'<div class="fld"><label for="cnote">What to look for</label><textarea id="cnote" maxlength="90">'+esc(c.note||"")+'</textarea></div>'
    +'<div class="fld"><label>Camp colour</label><div class="chips" id="cc">'
      +CAMP_COLORS.map(function(x){ return '<button type="button" class="chip cchip" data-c="'+x+'" style="background:'+x+'" aria-pressed="'+(c.color===x)+'" aria-label="'+x+'"></button>'; }).join("")
    +'</div></div></div>'
    +'<div class="ft"><button class="btn ghost" id="x">Cancel</button><button class="btn primary" id="ok">Save</button></div>';
  wireDice("cn");
  var pickCol=campColor(c);
  sheet.querySelector("#cc").onclick=function(e){
    var b=e.target.closest("[data-c]"); if(!b) return; pickCol=b.dataset.c;
    Array.prototype.forEach.call(this.children,function(x){ x.setAttribute("aria-pressed",x.dataset.c===pickCol); });
  };
  sheet.querySelector("#x").onclick=function(){ openCampSheet(c); };
  sheet.querySelector("#ok").onclick=function(){
    var nm=sheet.querySelector("#cn").value.trim();
    if(!nm){ toast("✍️","Camps need a name."); return; }
    var u=Object.assign({},c,{name:nm,note:sheet.querySelector("#cnote").value.trim(),color:pickCol});
    putCamp(u); closeSheet(); toast("✅","Saved.");
    if(!dbRef) renderAll();
  };
}

function openMeSheet(){
  var d=draftFromMe(), c=myCamp();
  sheet.innerHTML='<div class="hd"><div class="eyebrow">You</div><h2>Your mark</h2>'
    +'<div class="hint">'+(c?"Camping at "+esc(c.name):"Not in a camp yet")+'</div></div>'
    +'<div class="bd">'
    +'<div class="fld"><label for="yn">Your name</label><input type="text" id="yn" maxlength="22" value="'+esc(d.name)+'"></div>'
    +'<div class="fld"><label>Your mark</label>'+modeSegHTML(d)+'<div id="mkbox" style="margin-top:9px"></div></div>'
    +'</div><div class="ft">'
    +(c?'<button class="btn ghost" id="leave">Leave camp</button>':'')
    +'<button class="btn ghost" id="x">Cancel</button><button class="btn primary" id="ok">Save</button></div>';
  var repaint=markPicker(sheet.querySelector("#mkbox"),d);
  wireSeg(d,repaint);
  sheet.querySelector("#yn").oninput=function(){ d.name=this.value; if(d.mode==="initials") repaint(); };
  sheet.querySelector("#x").onclick=closeSheet;
  var lv=sheet.querySelector("#leave");
  if(lv) lv.onclick=function(){
    var m=me(); if(!m) return;
    m=Object.assign({},m); m.campId=""; putPerson(m);
    if(membersOf(c.id).filter(function(p){return p.id!==MEKEY;}).length===0) delCamp(c.id);
    closeSheet(); toast("\u{1F44B}","You left "+c.name+".");
    if(!dbRef) renderAll();
  };
  sheet.querySelector("#ok").onclick=function(){
    if(!d.name.trim()){ toast("✍️","Names only, please."); return; }
    saveMe(d,(me()||{}).campId||"");
    closeSheet(); toast("✅","Saved.");
    if(!dbRef) renderAll();
  };
  scrim.classList.add("on");
}

/* --- move mode --- */
var moveTarget=null;
function startMove(c){
  moveTarget=c; stage.classList.add("aiming");
  document.getElementById("moveBar").hidden=false;
  document.getElementById("moveTxt").textContent="Tap a new spot for "+c.name;
}
function endMove(){ moveTarget=null; stage.classList.remove("aiming"); document.getElementById("moveBar").hidden=true; }
document.getElementById("moveCancel").onclick=function(){ endMove(); };

/* --- tapping the map (pointer capture on #stage retargets click, so this is driven from pointerup) --- */
function handleTap(sx,sy){
  if(drag) return;
  var m=toMap(sx,sy), ar=areaAt(m.x,m.y);
  if(moveTarget){
    if(!ar){ toast("\u{1F6AB}","Pick a spot inside a dashed camping area."); return; }
    var c=Object.assign({},moveTarget,{x:Math.round(m.x),y:Math.round(m.y),area:ar.id});
    putCamp(c); endMove(); flyTo(c.x,c.y,Math.max(T.k,1.6)); thunk(); toast("\u{1F4CD}","Camp moved.");
    if(!dbRef) renderAll();
    return;
  }
  if(ar) openNewCamp(m.x,m.y,ar);
}
/* ---------- feedback ---------- */
function toast(ic,msg){
  var t=document.createElement("div"); t.className="toast";
  t.innerHTML='<span>'+ic+'</span><span>'+msg+'</span>';
  document.getElementById("toasts").appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(function(){t.remove();},420); },2800);
}
var cvs=document.getElementById("confetti"), cx2=cvs.getContext("2d"), parts=[], raf=null;
function sizeCanvas(){ var d=Math.min(2,devicePixelRatio||1); cvs.width=stage.clientWidth*d; cvs.height=stage.clientHeight*d; cx2.setTransform(d,0,0,d,0,0); }
function burst(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  sizeCanvas();
  var cols=["#c9502a","#e0a138","#6b5a90","#4e8b4a","#e9dfc7"];
  var x=stage.clientWidth/2, y=stage.clientHeight*0.42;
  for(var i=0;i<70;i++) parts.push({x:x,y:y,vx:(Math.random()-0.5)*11,vy:-Math.random()*10-2,
    g:0.32+Math.random()*0.14,s:3+Math.random()*4,c:cols[(Math.random()*cols.length)|0],a:1,
    rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.34});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx2.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(function(p){ return p.a>0.02&&p.y<stage.clientHeight+40; });
  parts.forEach(function(p){
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a-=0.006;
    cx2.save(); cx2.translate(p.x,p.y); cx2.rotate(p.rot);
    cx2.globalAlpha=Math.max(0,p.a); cx2.fillStyle=p.c;
    cx2.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx2.restore();
  });
  if(parts.length) raf=requestAnimationFrame(tick); else { raf=null; cx2.clearRect(0,0,cvs.width,cvs.height); }
}
var actx=null;
function thunk(){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(58,t+0.16);
    g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.0008,t+0.28);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.3);
    var b=actx.createBuffer(1,Math.floor(actx.sampleRate*0.08),actx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    var n=actx.createBufferSource(), ng=actx.createGain();
    n.buffer=b; ng.gain.value=0.1; n.connect(ng).connect(actx.destination); n.start(t);
  }catch(e){}
}
document.getElementById("soundBtn").onclick=function(){
  soundOn=!soundOn; ls("otis.sound",soundOn?"1":"0"); this.style.opacity=soundOn?"1":".45"; if(soundOn) thunk();
};
/* ---------- wire up ---------- */
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(x){ x.setAttribute("aria-selected",x===t); });
    document.querySelectorAll(".pane").forEach(function(p){ p.classList.toggle("on",p.id==="pane-"+t.dataset.pane); });
  };
});
document.getElementById("railToggle").onclick=function(){ document.getElementById("rail").classList.toggle("open"); };
window.addEventListener("resize",sizeCanvas);
sizeCanvas(); fit(); renderAll();
if(!CAMPS.length) setTimeout(function(){ toast("\u{1F4CD}","Tap inside a dashed area to drop the first camp."); },700);
})();
</script>
